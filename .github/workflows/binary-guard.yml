name: Binary Guard

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  binary-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run binary guard
        run: python tools/ci/check_no_binaries.py
