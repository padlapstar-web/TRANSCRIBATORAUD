name: Binary guard
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run binary guard
        run: python tools/ci/check_no_binaries.py
