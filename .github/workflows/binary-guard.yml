name: Binary guard
on:
  pull_request:
    branches: ['**']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Run no-binaries check
        run: |
          python tools/ci/check_no_binaries.py
